site_name: MatStream
site_url: https://doc.matstream.com/
theme:
  name: material
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - search.suggest
    - search.highlight
    - toc.integrate

nav:
  - Home: index.md
  - Platform:
    - What is MatStream?: platform/what-is-matstream.md
    - Core concepts: platform/core-concepts.md
    - How it works: platform/how-it-works.md
  - Solutions:
    - PLM: solutions/plm.md
    - Document Control: solutions/document-control.md
    - Quality Management: solutions/quality-management.md
    - Inventory Management: solutions/inventory-management.md
  - Getting started:
    - Quick start: getting-started/quick-start.md
    - Create an account: getting-started/create-account.md
    - Reset your password: getting-started/reset-password.md
    - Workspaces: getting-started/workspaces.md
    - Workspace setup: getting-started/workspace-setup.md
    - Accessing a workspace: getting-started/workspace-access.md
  - Administration:
    - Inviting users: admin/inviting-users.md
    - Users & groups: admin/users-groups.md
    - Add or edit a user: admin/workspace-user-dialog.md
    - Group membership: admin/group-membership-dialog.md
    - API keys: admin/api-keys.md
  - Configuration:
    - Overview: admin/configuration.md
    - Categories: admin/categories.md
    - Categories Editor: admin/categories-editor-dialog.md
    - Property definitions: admin/properties.md
    - Lifecycle definitions: admin/lifecycle.md
    - Revision schemes: admin/revision-schemes.md
    - Numbering schemes: admin/numbering.md
    - Import Definitions: features/import-definitions.md
  - Core features:
    - Entities: entities/overview.md
    - Properties: entities/properties.md
    - Revisions: entities/revisions.md
    - Lifecycle: entities/lifecycle.md
  - Features:
    - Explorer: features/explorer.md
    - Search: features/search.md
    - Import Definitions: features/import-definitions.md
  - Integrations:
    - MatStreamConnect: integrations/matstream-connect.md
    - Syncing with Vault: vault-integration/sync.md
  - Billing:
    - Overview: billing/overview.md
    - Upgrading your plan: billing/upgrading.md
    - Invoices: billing/invoices.md
    - Organisation settings: billing/organisation.md
  - Release notes:
    - Changelog: release-notes/changelog.md
  - Developer:
    - Deferred save pattern: dev/deferred-save-pattern.md
    - Coding agreements: dev/coding-agreements.md

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
