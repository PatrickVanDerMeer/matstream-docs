site_name: MatStream Help
site_url: https://help.matstream.com/

exclude_docs: |
  /test-stock-and-procurement.md
theme:
  name: material
  custom_dir: overrides
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - search.suggest
    - search.highlight

nav:
  - Home: index.md
  - Platform:
    - What is MatStream?: platform/what-is-matstream.md
    - PDM vs PLM: getting-started/what-is-matstream.md
    - Core concepts: platform/core-concepts.md
    - How it works: platform/how-it-works.md
  - Solutions:
    - PLM: solutions/plm.md
    - Document Control: solutions/document-control.md
    - Quality Management: solutions/quality-management.md
    - Inventory Management: solutions/inventory-management.md
    - Project Management: solutions/project-management.md
  - Getting started:
    - Quick start: getting-started/quick-start.md
    - Create an account: getting-started/create-account.md
    - Reset your password: getting-started/reset-password.md
    - Workspaces: getting-started/workspaces.md
    - Workspace setup: getting-started/workspace-setup.md
    - Accessing a workspace: getting-started/workspace-access.md
  - Work Flows:
    - Overview: workflows/index.md
    - Sales Order flow: features/sales-orders.md
  - Administration:
