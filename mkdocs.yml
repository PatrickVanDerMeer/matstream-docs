    - AI Assistant: features/ai-assistant.md
    - Automations: features/automations.md
    - Barcode scanning: features/barcode.md
    - Collaborate: features/collaborate.md
    - Copy Structure: features/copy-structure.md
    - Dashboard: features/dashboard.md
    - Explorer: features/explorer.md
    - Filter Items & Snapshots: features/filter-items.md
